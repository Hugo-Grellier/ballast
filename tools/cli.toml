# What this standard version needs from the global `ballast` command.
# `ballast doctor` reads this file as data and never executes it.

[cli]
# Bump only when this standard relies on a CLI behaviour added after it.
minimum = "0.1.0"

[doctor]
# Read-only probes this version supports: `tools/setup --check` and
# `tools/spec_workflow/launcher.py status --json`.
probes = ["setup-check", "launcher-status"]

[setup]
# This version's setup stages, journals and switches installations, so a
# failed or interrupted setup keeps the previous installation (#14).
recoverable = true
# The first `ballast run`, `ledger` or `intake` in a checkout with no
# installation prepares it from a verified installation on this machine (#15).
prepare = true

[init]
# `ballast init` runs this version's tools/init before a project pins it (#13).
supported = true

[runs]
# The saved-run format this version writes, and the formats it can resume.
# Change `format` (and decide `resumes`) whenever saved run state stops being
# resumable: the Spec Kit version, a shipped workflow's step IDs, or Ballast's
# run records. `ballast preview` reads both as data.
format = "ballast-run/1"
resumes = ["ballast-run/1"]
