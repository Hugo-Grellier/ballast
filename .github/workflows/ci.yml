name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      # Ballast 2.0 suites only; released v1 stays verified in its tags.
      - run: uv run --locked python -m unittest tests/test_codex_routing.py tests/test_standalone_execution.py tests/test_queue_admission.py
