name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx ruff check
      - run: uvx ruff format --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      # Tests that need a systemd user session, the Codex sandbox or the
      # Spec Kit CLI skip themselves here; run them locally before a release.
      - run: uv run --no-project --python 3.13 --with pyyaml python -m unittest tests/test_*.py
