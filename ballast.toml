# Ballast installs itself here. Contributors developing the standard can set
# BALLAST_STANDARD_DIR to this checkout to run their working copy instead.
[standard]
ref = "v0.10.0"

[agents.permissions]
extra_allow = [
  "Bash(uvx ruff check*)",
  "Bash(uvx ruff format*)",
  "Bash(uv run --no-project --python 3.13 --with pyyaml python -m unittest *)",
]

[github]
repository = "Hugo-Grellier/ballast"

[checks]
commands = [
  "uvx ruff check",
  "uvx ruff format --check",
  "uv run --no-project --python 3.13 --with pyyaml python -m unittest tests/test_*.py",
]
timeout_minutes = 30

# Privileged actions the operator authorizes before merge in Autonomous runs
# (operator decision 2026-10-06: the driving agent runs `ballast trust` on
# checkouts it set up and uses the disposable scratch repository for live checks).
[autonomous]
authorized_privileged_actions = [
  "operator-trust",
  "scratch-repository",
]
