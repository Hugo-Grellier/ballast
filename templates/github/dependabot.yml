# Weekly updates with patch releases grouped into one PR per ecosystem.
# Copy to .github/dependabot.yml, keep github-actions, and add one entry per
# ecosystem and manifest directory the project uses (uv, npm, docker, ...).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      patch-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
