# The helpers ship as the `ballast` command (`uvx --from git+...@vX.Y.Z ballast`);
# they stay standard-library-only, so the package has no runtime dependencies.
# The Git tag is the version record, so the package version stays 0. The gate's
# pinned tools and lint configuration live here too.
[project]
name = "ballast"
version = "0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ballast = "tools.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff==0.17.0"]

[tool.uv]
# The gate never installs the package; only `uvx --from` builds it.
package = false

# The wheel's top-level import name is `tools`, as in the checkout. That is safe
# in uvx's isolated environment; do not install it into a shared environment.
[tool.uv.build-backend]
module-name = "tools"
module-root = ""
namespace = true

[tool.ruff]
target-version = "py311"
namespace-packages = ["tests", "tools"]

[tool.ruff.lint]
select = ["ALL"]
# COM812 is redundant with Ruff's formatter; D203/D213 conflict with D211/D212.
# CPY001 requires a copyright policy, which this repository does not set.
ignore = ["COM812", "CPY001", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# The test suite uses the standard-library unittest API, so pytest-style rules
# do not apply; named test methods also do not need individual docstrings.
"tests/**/*.py" = ["D102", "PT009", "PT027"]
# A byte-identical copy of tools/pr_body.py, checked by tests/test_pr_body.py.
"templates/github/scripts/pr_body.py" = ["INP001"]
